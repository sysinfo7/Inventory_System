name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inventory
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://inventory:ci-only-password@localhost:5433/inventory
      APP_DATABASE_URL: postgresql://inventory_runtime:ci-only-runtime-password-32-characters-long@localhost:5433/inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run db:provision-app
      - run: npm run db:verify-stock
      - run: npm run db:verify-stock-concurrency
      - name: Start the built application
        run: nohup npm run start > next-server.log 2>&1 &
      - name: Wait for the application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat next-server.log
          exit 1
      - name: Verify authentication and permissions
        env:
          AUTH_TEST_BASE_URL: http://127.0.0.1:3000
          ACTIVITY_FILTER_CI_TESTS: 'true'
          AUTH_PASSWORD_CHANGE_CI_TESTS: 'true'
        run: npm run auth:verify
